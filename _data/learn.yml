    title: Community
    subtitle: Description
    topic: industry
    city: eindhoven
    image: /assets/img/learn-1.jpg
    summary: What happens when you bring a room full of women+ in design together? The conversations, connections and recognition that came out of our evenings.
    body: |
      Every WID event ends with something to take home. In this space we share the learnings of an evening: what was discussed, which questions stayed with us and which ideas we want to keep working on.

      Think of key insights from the panel, quotes from speakers, the outcomes of the group sessions and links to tools, books or people that were mentioned during the evening.

      Were you there and want to add something? Or would you like to share your own learning with the community? Get in touch through the contact page — we would love to hear from you.
